[preset.0]
name="Template PCK"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray("res://Main.tscn", "res://assets/fonts/TemplateCJK.otf")
include_filter="addons/NAKAMA_SDK_LICENSE,assets/fonts/LICENSE-CJK.txt"
exclude_filter="tests/*,tests/**,*.private.*,*.pem"
export_path="../artifacts/template.pck"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=false
